# =============================================================================
# Caller Workflow - Manual Vercel Deployment
# =============================================================================
# Source: Wamocon/github_workflow/examples/caller-production-deploy.yml
#
# Trigger : MANUAL ONLY - Actions tab → "Deploy to Vercel" → Run workflow
#           Choose "production" (live URL) or "preview" (test URL) at run time.
#           This workflow NEVER runs automatically.
#
# Secrets required:
#   - VERCEL_PROJECT_ID → add this to your repo's GitHub secrets
#                         (Vercel Project → Settings → General → Project ID)
#
# Already set at organisation level (no action needed):
#   - VERCEL_TOKEN   → personal Vercel access token
#   - VERCEL_ORG_ID  → Vercel personal account ID
#
# How it works:
#   Builds locally via Vercel CLI - Vercel never sees the GitHub repo owner,
#   so there are no "team seat" errors on a personal Hobby account in a GitHub org.
# =============================================================================

name: Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview
      db_schema:
        description: "Optional NEXT_PUBLIC_DB_SCHEMA override (leave empty to use Vercel env vars)"
        required: false
        type: string
        default: ""

jobs:
  deploy:
    name: Deploy - ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_DB_SCHEMA: ${{ inputs.db_schema || 'public' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: |
          export GITHUB_ACTIONS=""
          export GITHUB_REPOSITORY=""
          vercel pull --yes --environment=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: |
          export GITHUB_ACTIONS=""
          export GITHUB_REPOSITORY=""
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Deploy to Vercel
        run: |
          export GITHUB_ACTIONS=""
          export GITHUB_REPOSITORY=""
          PROD_FLAG=""
          [[ "${{ inputs.environment }}" == "production" ]] && PROD_FLAG="--prod"
          vercel deploy --prebuilt --archive=tgz $PROD_FLAG --yes --token=${{ secrets.VERCEL_TOKEN }}
